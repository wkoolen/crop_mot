# B2 run: a Bernoulli filter seeded from a CLUTTER detection, so r should decay.
#
# This is the phantom-track experiment. A track is born from a detection that has no plant
# behind it; every subsequent scan fails to produce a detection there, and the
# misdetection branch of the Bernoulli update drives r downward. The resulting r-vs-k curve
# is the B2 deliverable, and B3 checks it against the hand-derived A2 recursion.

name: b2_bernoulli_phantom
seed: 42

# Points at the B1 scenario rather than restating it. There is no config-merge or
# inheritance machinery - a run config POINTS AT a scenario file and is otherwise
# self-contained, so "which world did this run use" is a one-line answer.
scenario: configs/b1_two_rows.yaml

filter:
  kind: bernoulli

  # ASSUMPTION: plants do not move. q = 0 means a genuinely static target; raise it very
  # slightly only if the covariance collapses numerically over a long run.
  motion: {kind: static, q: 0.0}

  measurement:
    kind: linear_xy
    R: [[0.04, 0.0],
        [0.0, 0.04]]

  # What the FILTER believes about the detector. Deliberately a separate block from the
  # scenario's `sensor`: setting these to different values is how a model-mismatch
  # experiment is run, and keeping them separate is why the filter can never be handed the
  # true parameters by accident.
  assumed_sensor:
    fov: {min_range: 0.3, max_range: 4.0, half_angle: 0.6}
    detection: {kind: constant, p_D: 0.85}
    lambda_FA: 2.0

  birth:
    # Seed one Bernoulli component from one detection at one scan. Choose an index that is
    # clutter in this seed by inspecting labels.jsonl after simulating - the birth model
    # itself stays truth-blind, so this is the config author's job.
    #
    # Seed 42, scan 24, detection 14 is a clutter return at (1.94, 1.82), 1.19 m from the
    # nearest plant. It is the return chosen on 2026-09-24, then detection 12 at
    # (1.94, 4.82): since the field moved 3 m ahead of the robot's start (D44) every y is
    # 3 m lower, and the clutter stream does not depend on the plants, so the same scan
    # holds the same return; only its index changed. The first choice, scan 0 /
    # detection 0, was clutter 0.71 m from a plant: its gate reached the plant, the
    # collapse moved the track onto it, and r went to 1 - a captured phantom, not a
    # decaying one.
    #
    # What this run shows, deliberately kept (2026-10-01): r decays from 0.08 to 4.4e-3
    # over scans 24-26, then the phantom is RECAPTURED - r passes 0.5 at k = 30 and goes
    # to 1. (In the field before D44: to ~2e-4 over scans 24-31, recaptured at k = 37.)
    # Under collapse: best_branch the branch weights compare r(1 - p_D) with
    # r p_D N(z; z_hat, S) / (lambda_FA c(z)), so r cancels and the Gaussian jumps to any
    # detection within ~1 m however small r is; with no pruning the near-dead phantom
    # wanders onto a plant and is confirmed. (init_cov 0.06 keeps this seed's phantom
    # dead, r about 1e-5; pruning at the bank's r_min = 1e-3 would not remove it here,
    # since r never falls below 4.4e-3.)
    kind: single_from_measurement
    at_scan: 24
    detection_index: 14
    # PHASE-1 STAND-IN: a configured constant in place of the measurement-driven
    # r_b = e / (e + lambda_FA c(z)), e = integral lambda_u(x) p_D(x) g(z|x) dx  [A2 §4].
    r_b: 0.08
    # Noticeably larger than R: a single measurement localises the target only up to the
    # measurement noise, and starting over-confident makes the first few updates misleading.
    # 0.12 = 3 R. With 0.25 the 99% gate spans ~8 m^2 of the 9.5 m^2 FOV and every clutter
    # return in this seed is captured by a nearby plant.
    init_cov: [[0.12, 0.0],
               [0.0, 0.12]]

  # ASSUMPTION: plants are permanent. With p_S = 1 the prediction leaves r untouched, so
  # every bit of decay in the B2 plot is attributable to the detector model rather than to
  # an assumed death process.
  survival: {p_S: 1.0}

  gate: {chi2_prob: 0.99}

  # How the post-update mixture (missed branch + one branch per gated detection) collapses
  # back to one Gaussian. best_branch keeps the highest-weight branch; see
  # crop_mot/filters/collapse.py for the alternatives' extension point.
  collapse: best_branch

analysis:
  b3_reference: bernoulli_existence   # the A2 closed form
  monte_carlo: {n_runs: 50}           # empirical backing; small by design in phase 1
  plots: [scene, r_vs_k, r_vs_analytic, r_montecarlo]
