# B2 run: b2_bernoulli_bank_phantoms.yaml in a field WITH WEEDS (decision D15).
#
# The same five phantoms - the same Poisson clutter returns at the same scans, seeded with
# the same r_b, init_cov and pruning - but the scenario is b1_two_rows_weeds.yaml, so the
# scans also hold weed detections. Everything the filter sees apart from those is identical
# to the run without weeds, so the two hypotheses figures compare directly: any phantom
# whose fate differs was changed by the weeds.
#
# Only the detection indices differ from the run without weeds: detections are sorted by
# position, so the weed detections shift the clutter returns' indices. The filter is
# unchanged and still assumes Poisson clutter - it has no notion of a weed.
#
# The original run's description follows.
#
# The single-phantom run (b2_bernoulli_phantom.yaml) follows one track and never deletes
# it, so its phantom is eventually recaptured by a plant (D9). This run follows several
# phantoms at once and deletes each one whose r falls below prune.r_min - A2 §5's
# "look-and-miss ratchets r down until it is deleted". Because r_min > 0, `track` also
# writes estimates_bernoulli_bank_unpruned.jsonl: the same filter without pruning, on the
# same detections, which the `hypotheses` plot draws after each deletion.

name: b2_bernoulli_bank_weeds
seed: 42

scenario: configs/b1_two_rows_weeds.yaml

filter:
  # Independent Bernoulli components, one per seed, each advanced by the unchanged
  # `bernoulli` filter. They do not compete for detections - fine while the seeds are more
  # than a gate apart, which the candidates command checks.
  kind: bernoulli_bank

  motion: {kind: static, q: 0.0}

  measurement:
    kind: linear_xy
    R: [[0.04, 0.0],
        [0.0, 0.04]]

  # Identical to b2_bernoulli_phantom.yaml, so seed (24, 12) reproduces that run's track.
  assumed_sensor:
    fov: {min_range: 0.3, max_range: 4.0, half_angle: 0.6}
    detection: {kind: constant, p_D: 0.85}
    lambda_FA: 2.0

  birth:
    kind: from_measurements
    # The seeds of b2_bernoulli_bank_phantoms.yaml, re-indexed for the scans with weeds
    # (2026-09-28): the same Poisson clutter returns, found by position. All five are
    # transient clutter; the nearest weed (seed 42) is given per seed.
    # The list position is the track id.
    seeds:
      - {at_scan: 7,  detection_index: 17}   # #0 (1.81, 3.10); nearest weed 9, 1.24 m
      - {at_scan: 24, detection_index: 14}   # #1 (1.94, 4.82); weed 12, 0.38 m
      - {at_scan: 38, detection_index: 0}    # #2 (-2.01, 5.82); weed 14, 1.46 m; never in view again
      - {at_scan: 40, detection_index: 13}   # #3 (1.88, 6.35); weed 13, 0.52 m
      - {at_scan: 47, detection_index: 0}    # #4 (-1.77, 7.01); weeds 8 and 14, 0.29 m
    r_b: 0.08
    init_cov: [[0.12, 0.0],
               [0.0, 0.12]]

  survival: {p_S: 1.0}

  gate: {chi2_prob: 0.99}

  collapse: best_branch

  # A2 §5's deletion (D13): a component whose predicted r is below r_min is removed. With
  # p_D = 0.85 an in-view miss multiplies the odds r / (1 - r) by 0.15, so r_b = 0.08
  # falls below 1e-3 after about three in-view misses.
  prune: {r_min: 1.0e-3}

analysis:
  # Every bank track is the A2 recursion (D12), so each is checked against the closed form.
  # Pruning has no counterpart in A2, so the check reads the unpruned companion log (D14).
  b3_reference: bernoulli_existence
  monte_carlo: null
  plots: [scene, counts, hypotheses, r_vs_analytic]
