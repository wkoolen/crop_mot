# Roadmap step 8b: N known, in the field with weeds, and the detector's class labels used.
# Same filter as b4_known_n_bank_weeds.yaml plus `assumed_classifier`: the filter believes
# the detector labels perfectly (the scenario's default classifier), so a plant track never
# associates a weed-labelled detection, even inside its gate (decision D22). Compare the
# `gate_contents` figure with the label-blind run: the weed returns leave the gates.
#
# Each slot is a Bernoulli component with r = 1 (N is known; certainty is absorbing,
# A2 §5), placed at its nominal position with a prior std of sqrt(0.02^2 + 0.03^2) =
# 0.036 m. There are no births: nothing new is ever believed to exist. Clutter is not in
# the plan, so to the filter every clutter return is a false positive.
#
# The prior (about 4 cm) is much tighter than the measurement noise (20 cm), so the
# problem is almost pure association. The innovation covariance is still dominated by R,
# so each gate is about 0.6 m wide and neighbouring plants 0.35 m apart share detections:
# the bank's independence approximation (D12) does not hold here, which is what JPDA
# (roadmap step 12) is for. `gate_contents` measures how often each failure happens.

name: b4_known_n_bank_labels
seed: 42

scenario: configs/b1_two_rows_weeds.yaml

filter:
  kind: bernoulli_bank
  motion: {kind: static, q: 0.0}
  measurement:
    kind: linear_xy
    R: [[0.04, 0.0],
        [0.0, 0.04]]
  assumed_sensor:
    fov: {min_range: 0.3, max_range: 4.0, half_angle: 0.6}
    detection: {kind: constant, p_D: 0.85}
    lambda_FA: 2.0
  # The farmer's plan: the scenario's rows, nominal positions only (never truth.jsonl).
  plan:
    rows:
      - {x: -0.75, y_start: 0.0, y_end: 8.4, spacing: 0.35}
      - {x:  0.75, y_start: 0.0, y_end: 8.4, spacing: 0.35}
    prior_std: 0.036
  birth: null          # N known: no births
  # What the filter believes about the class labels: the perfect classifier. Plants and
  # weeds are labelled what they are; clutter is labelled "plant" and still reaches the
  # plant tracks as a false positive.
  assumed_classifier:
    plant:   {plant: 1.0, weed: 0.0}
    weed:    {plant: 0.0, weed: 1.0}
    clutter: {plant: 1.0, weed: 0.0}
  survival: {p_S: 1.0}
  gate: {chi2_prob: 0.99}
  collapse: best_branch

analysis:
  b3_reference: null   # every slot has r = 1 throughout; the A2 check is for births
  monte_carlo: null
  plots: [scene, tracks, existence_map, cardinality, gospa, nees, gate_contents]
